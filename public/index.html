<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gas fee · Pharos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>gas fee</h1>
        <p class="sub">What a Pharos transaction should pay, measured from the chain rather than estimated.</p>
      </header>

      <form id="form" novalidate>
        <div class="grid">
          <label>
            <span>gas limit</span>
            <input id="gasLimit" name="gasLimit" inputmode="numeric" value="162849" required />
          </label>
          <label>
            <span>gas expected to use</span>
            <input id="gasUsed" name="gasUsed" inputmode="numeric" placeholder="same as limit" />
          </label>
          <label>
            <span>maxFee you were about to set <em>gwei</em></span>
            <input id="maxFeeGwei" name="maxFeeGwei" inputmode="decimal" placeholder="22.91779976" />
          </label>
          <label>
            <span>tip you were about to set <em>gwei</em></span>
            <input id="tipGwei" name="tipGwei" inputmode="decimal" placeholder="0" />
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="submit">measure</button>
          <span class="hint">base fee and tip statistics always come from the node</span>
        </div>
      </form>

      <p id="error" class="error" hidden></p>

      <section id="result" hidden>
        <div class="verdict-row">
          <span id="verdict" class="verdict">—</span>
          <span id="verdictNote" class="verdict-note"></span>
        </div>

        <ul id="reasons" class="reasons"></ul>

        <div class="panels">
          <section>
            <h2>market</h2>
            <dl id="market"></dl>
          </section>
          <section>
            <h2>cost</h2>
            <dl id="cost"></dl>
          </section>
        </div>

        <section>
          <h2>sample</h2>
          <dl id="sample"></dl>
        </section>

        <section id="waiting-section">
          <h2>can waiting help</h2>
          <p id="waiting"></p>
          <ul id="waitingReasons" class="reasons small"></ul>
        </section>
      </section>

      <section id="notMeasuredSection" class="not-measured">
        <h2>not measured</h2>
        <ul id="notMeasured"></ul>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
